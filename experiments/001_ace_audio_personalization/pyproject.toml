[project]
name = "maestro-ace"
version = "0.1.0"
description = "Experiment 001: ACE audio personalization with SFT and human/AI preferences"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=2.0,<3", "soundfile>=0.13,<0.14", "pydantic>=2.11,<3"]

[project.optional-dependencies]
smoke = ["torch>=2.6,<3"]

[project.scripts]
maestro-ace = "maestro_ace.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maestro_ace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
